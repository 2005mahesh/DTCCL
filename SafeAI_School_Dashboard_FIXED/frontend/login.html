<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeAI School — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="auth-card">
    <div class="logo">🛡️ SafeAI School</div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="muted" id="authSubtitle">Login to continue your safe AI learning journey.</p>

    <div class="tabs" role="tablist">
      <button id="loginTab" type="button" class="active">Login</button>
      <button id="registerTab" type="button">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <label id="nameLabel" for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" hidden>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="Password (8+ characters)" required>

      <button id="authSubmit" class="primary" type="submit">Continue</button>
    </form>

    <p id="authMsg" class="message" aria-live="polite"></p>

    <div class="demo-box">
      <b>Demo Teacher</b><br>
      Email: teacher@safeai.local<br>
      Password: Teacher123!
    </div>

    <div class="api-status" id="apiStatus"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
